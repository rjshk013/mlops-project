version: '3.9'

services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chatbot
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    networks:
      - chatbot-network
    restart: unless-stopped

volumes:
  chroma_db:

networks:
  chatbot-network:
    driver: bridge
